name: Real performance comparison
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact baseline commit for both real-input comparisons
        default: ae7721b7d3099980b884175cde1a3b07fc3fb1b5
        required: true
      regional:
        description: Also compare the complete regional HTTP workflow
        type: boolean
        default: true
  push:
    branches: [perf/measured-hotpath-20261103, perf/real-pipeline-throughput-20261103, perf/single-pass-motion-20261103, perf/flight-sieve-reuse-20261103, perf/flight-sieve-94a6, perf/flight-sieve-combined-94a6, perf/prepared-flight-scoring-20261103, perf/prepared-flight-search-20261103, perf/integrated-search-47383f75]
    paths:
      - .github/workflows/real-performance.yml
      - src/dopplergeist/**
      - scripts/benchmark_prepared_measurements.py
      - scripts/benchmark_prepared_flight_search.py
      - scripts/prepare_flight_index.py
      - scripts/benchmark_real_cpa_rows.py
      - scripts/export_real_acoustic_controls.py
      - scripts/benchmark_real_regional_upload.py
      - scripts/benchmark_real_bounded_upload.py
      - scripts/benchmark_real_bounded_comparison.py
      - scripts/benchmark_real_refinement.py
      - scripts/benchmark_real_discovery_normalization.py
      - scripts/prepare_reference_upload.py
      - scripts/restore_artifacts.py
      - scripts/compare_real_upload_performance.py
      - scripts/check_real_upload_arrays.py
      - pyproject.toml
      - tests/test_real_*.py
      - tests/test_refinement_geographic_bounds.py
      - tests/data/real-ridge-batch-arithmetic.json
      - tests/data/reference-empty-tiles-real.json
      - tests/data/reference-retention-real.json
      - tests/data/reference-cpa-real.json
      - tests/data/real-refinement-profile.json
      - tests/fixtures/real_discovery_normalization.json
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CC: gcc
  PYTHONPATH: src
  BASELINE_REF: ${{ inputs.baseline || 'ae7721b7d3099980b884175cde1a3b07fc3fb1b5' }}
jobs:
  compare:
    if: github.event_name != 'push' || github.ref != 'refs/heads/perf/real-pipeline-throughput-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install runtime and source-tree extensions
        run: |
          python -m pip install 'setuptools>=68'
          python -m pip install --editable '.[test]'
          python - <<'PY'
          from dopplergeist import matching, native_acoustic, native_cpa
          assert callable(matching._native_fit_irls), "Native ridge extension did not build"
          assert callable(matching._native_fit_irls_batch), "Native batch fitter did not build"
          assert callable(matching._native_validate_ridge_events), "Native evidence validator did not build"
          assert callable(matching._native_ridge_module.event_fit_reason), "Native diagnostic validator did not build"
          assert matching.RIDGE_FIT_BACKEND.startswith("native-c-")
          assert native_acoustic._native is not None, "Native acoustic extension did not build"
          assert native_acoustic.ACOUSTIC_BACKEND.startswith("native-c-")
          assert native_cpa._native is not None, "Native CPA extension did not build"
          print({"ridge_fit_backend": matching.RIDGE_FIT_BACKEND,
                 "acoustic_backend": native_acoustic.ACOUSTIC_BACKEND})
          PY
      - name: Restore public recorded observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_artifacts.py --bundle data-adsb-derived --bundle data-terrain
      - name: Prepare index and baseline
        run: |
          baseline_commit=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          git worktree add --detach "$RUNNER_TEMP/baseline" "$baseline_commit"
          if [ -f "$RUNNER_TEMP/baseline/setup.py" ]; then
            (cd "$RUNNER_TEMP/baseline" && python setup.py build_ext --inplace)
          fi
          PYTHONPATH="$RUNNER_TEMP/baseline/src" python scripts/prepare_reference_upload.py --data-root data --output benchmark-inputs
          mkdir -p benchmark-inputs/reference-checkout
          ln -s "$GITHUB_WORKSPACE/evidence/results" benchmark-inputs/reference-checkout/results
          ln -s "$GITHUB_WORKSPACE/data" benchmark-inputs/reference-checkout/data
      - name: Freeze real workloads
        run: |
          for width in 120 10; do
            python scripts/benchmark_prepared_measurements.py prepare --discovery evidence/audio/w1-sensitivity-20261102/reference/discovery.json --index benchmark-inputs/reference-region.sqlite --clock-half-width-s "$width" --output "benchmark-inputs/point-$width.json"
          done
          python scripts/benchmark_prepared_measurements.py prepare \
            --discovery evidence/audio/w1-sensitivity-20261102/reference/discovery.json \
            --index benchmark-inputs/reference-region.sqlite \
            --reference-report evidence/results/reference-local/report.json \
            --full-day --max-tracks 2000 --max-samples 500000 --max-candidates 20000 \
            --anchor-window-s 1788864888.7151732 1788865236.7214916 \
            --include-track-query --output benchmark-inputs/dense-query.json
      - name: Prepare reusable numeric trajectory inputs
        run: |
          python scripts/benchmark_prepared_flight_search.py prepare-index \
            --source src --index benchmark-inputs/reference-region.sqlite \
            --destination benchmark-inputs/reference-region-prepared.sqlite \
            --output results/flight-preparation.json
      - name: Export real pipeline objective controls
        env:
          DOPPLERGEIST_RIDGE_BACKEND: python
          DOPPLERGEIST_ACOUSTIC_BACKEND: python
        run: python scripts/export_real_acoustic_controls.py --fixture benchmark-inputs/point-120.json --output results/real-acoustic-controls.json
      - name: Real-input regression tests
        env:
          DOPPLERGEIST_REAL_CPA_FIXTURE: benchmark-inputs/point-120.json
          DOPPLERGEIST_REAL_DENSE_QUERY: benchmark-inputs/dense-query.json
          DOPPLERGEIST_REAL_DEVELOPMENT_INDEX: benchmark-inputs/reference-region.sqlite
          DOPPLERGEIST_REAL_REFERENCE_ROOT: benchmark-inputs/reference-checkout
          DOPPLERGEIST_REAL_REFERENCE_DISCOVERY: evidence/audio/w1-sensitivity-20261102/reference/discovery.json
        run: >-
          python -m pytest -q
          tests/test_real_prepared_measurements.py
          tests/test_real_geometry_kinematics.py
          tests/test_real_batch_scalar_parity.py
          tests/test_real_motion_support_batch.py
          tests/test_real_single_pass_sieve.py
          tests/test_real_refinement_lookup.py
          tests/test_real_cpa_preparation.py
          tests/test_real_partition_query.py
          tests/test_real_native_cpa.py
          tests/test_real_native_ridge.py
          tests/test_real_native_ridge_batch.py
          tests/test_real_native_prefix_integration.py
          tests/test_real_native_ridge_long.py
          tests/test_real_ridge_backend.py
          tests/test_real_legacy_batch_cache.py
          tests/test_real_native_acoustic.py
          tests/test_real_native_acoustic_pipeline.py
          tests/test_real_batch_ceilings.py
          tests/test_real_acoustic_screen_cache.py
          tests/test_real_cpa_spatial_sieve.py
          tests/test_real_native_validation.py
          tests/test_real_index_columns.py
          tests/test_real_track_cache.py
          tests/test_real_scalar_terrain.py
          tests/test_real_scoring_inputs.py
          tests/test_real_trial_prefix.py
          tests/test_real_candidate_setup.py
          tests/test_real_retention_batch.py
          tests/test_real_native_convergence.py
          tests/test_real_flight_payload.py
          tests/test_real_prepared_index.py
          tests/test_real_trial_vectors.py
          tests/test_real_refinement_reuse.py
          tests/test_refinement_geographic_bounds.py
          tests/test_real_discovery_normalization.py
          tests/test_real_association_budget.py
          tests/test_real_association_clock_window.py
      - name: Verify the explicit Python fallback on recorded arithmetic
        env:
          DOPPLERGEIST_REAL_CPA_FIXTURE: benchmark-inputs/point-120.json
          DOPPLERGEIST_RIDGE_BACKEND: python
          DOPPLERGEIST_ACOUSTIC_BACKEND: python
          DOPPLERGEIST_CPA_BACKEND: python
        run: python -m pytest -q tests/test_real_batch_scalar_parity.py tests/test_real_legacy_batch_cache.py tests/test_real_scoring_inputs.py tests/test_real_trial_prefix.py tests/test_real_candidate_setup.py
      - name: Compare real CPA preparation
        run: python scripts/benchmark_real_cpa_rows.py --baseline-source "$RUNNER_TEMP/baseline/src" --output results/cpa-rows.json --repeats 5 --iterations 20
      - name: Compare complete payloads and timings
        run: |
          benchmark_cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          native_option=()
          if [ -f src/dopplergeist/_native_ridge.c ]; then
            native_option=(--require-current-native)
          fi
          if [ -f src/dopplergeist/_native_acoustic.c ]; then
            native_option+=(--require-current-native-acoustic)
          fi
          if [ -f src/dopplergeist/_native_cpa.c ]; then
            native_option+=(--require-current-native-cpa)
          fi
          for width in 10 120; do
            taskset -c "$benchmark_cpu" python scripts/benchmark_prepared_measurements.py compare --fixture "benchmark-inputs/point-$width.json" --baseline-source "$RUNNER_TEMP/baseline/src" --current-source src --repeats 3 --timeout-s 600 --output "results/performance-$width" "${native_option[@]}"
          done
          taskset -c "$benchmark_cpu" python scripts/benchmark_prepared_measurements.py compare \
            --fixture benchmark-inputs/dense-query.json --include-track-query --clock-partition-query \
            --baseline-source "$RUNNER_TEMP/baseline/src" --current-source src \
            --repeats 3 --timeout-s 600 --output results/performance-dense-query \
            "${native_option[@]}"
          taskset -c "$benchmark_cpu" python scripts/benchmark_prepared_flight_search.py compare \
            --fixture benchmark-inputs/dense-query.json \
            --baseline-source "$RUNNER_TEMP/baseline/src" --current-source src \
            --baseline-index benchmark-inputs/reference-region-prepared.sqlite \
            --current-index benchmark-inputs/reference-region-prepared.sqlite \
            --preparation-report results/flight-preparation.json \
            --repeats 3 --timeout-s 600 --output results/performance-prepared-flight-search \
            --require-native --require-native-acoustic --require-current-prepared
      - name: Profile remaining point work outside the timing comparison
        run: |
          python -m cProfile -o results/current-point.prof scripts/benchmark_prepared_measurements.py _worker --source src --fixture benchmark-inputs/point-120.json --output results/current-point-profile --require-native --require-native-acoustic
          python - <<'PY'
          import json
          from pathlib import Path
          import pstats

          statistics = pstats.Stats("results/current-point.prof")
          root = Path.cwd()
          records = []
          for (filename, line, function), (primitive, total, own, cumulative, callers) in statistics.stats.items():
              path = Path(filename)
              relative = path.relative_to(root).as_posix() if path.is_relative_to(root) else filename
              module = (relative[4:-3].replace("/", ".") if relative.startswith("src/")
                        and relative.endswith(".py") else path.stem)
              records.append({"module": module, "file": relative, "line": line, "function": function,
                              "primitive_calls": primitive, "total_calls": total,
                              "self_seconds": own, "cumulative_seconds": cumulative})
          records.sort(key=lambda row: (-row["cumulative_seconds"], -row["self_seconds"],
                                        row["file"], row["line"], row["function"]))
          summary = {"scope": "Separate profiled width-120 worker, including imports and input loading; excluded from timing medians",
                     "timer": "cProfile default elapsed timer; diagnostic attribution, not an uninstrumented CPU measurement",
                     "total_calls": statistics.total_calls, "primitive_calls": statistics.prim_calls,
                     "total_profiled_seconds": statistics.total_tt, "top_50": records[:50],
                     "dopplergeist_functions": [row for row in records if row["module"].startswith("dopplergeist")]}
          output = Path("results/current-point-profile-stats.json")
          output.write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps({"profile_summary": str(output), "excluded_from_timing_medians": True,
                            "top_10": records[:10]}, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-performance-summary
          path: |
            results/cpa-rows.json
            results/real-acoustic-controls.json
            results/flight-preparation.json
            results/performance-*/comparison.json
            results/performance-*/*/summary.json
            results/current-point.prof
            results/current-point-profile-stats.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: real-performance-failure-diagnostics
          path: results/performance-*
          if-no-files-found: ignore
          retention-days: 3
  regional:
    if: github.ref == 'refs/heads/perf/single-pass-motion-20261103' || (github.event_name == 'workflow_dispatch' && inputs.regional)
    # Keep the reference FFmpeg family; a new encoder can change detected ridges.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install runtime and source-tree extensions
        run: |
          python -m pip install 'setuptools>=68'
          python -m pip install --editable '.[test]'
          python - <<'PY'
          from dopplergeist import matching, native_acoustic
          assert callable(matching._native_fit_irls), "Native ridge extension did not build"
          assert matching.RIDGE_FIT_BACKEND.startswith("native-c-")
          assert native_acoustic._native is not None, "Native acoustic extension did not build"
          assert native_acoustic.ACOUSTIC_BACKEND.startswith("native-c-")
          print({"ridge_fit_backend": matching.RIDGE_FIT_BACKEND,
                 "acoustic_backend": native_acoustic.ACOUSTIC_BACKEND})
          PY
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Restore the complete real recording and observed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_artifacts.py --bundle data-source --bundle data-adsb-derived --bundle data-terrain
      - name: Prepare common inputs and the baseline
        run: |
          python scripts/prepare_reference_upload.py --data-root data --output benchmark-inputs
          baseline_commit=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          git worktree add --detach "$RUNNER_TEMP/baseline" "$baseline_commit"
          if [ -f "$RUNNER_TEMP/baseline/setup.py" ]; then
            (cd "$RUNNER_TEMP/baseline" && python setup.py build_ext --inplace)
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("benchmark-inputs/operator.json")
          operator = json.loads(path.read_text())
          operator["search_workers"] = 1
          path.write_text(json.dumps(operator, indent=2) + "\n")
          PY
          ffmpeg -nostdin -i data/source/reference-recording.wav -ac 1 -ar 48000 -c:a libmp3lame -b:a 96k benchmark-inputs/reference.mp3
      - name: Measure three alternating complete HTTP pairs and require exact parity
        run: |
          benchmark_cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          for pair in 1 2 3; do
            arms=(baseline current)
            if [ "$pair" = 2 ]; then arms=(current baseline); fi
            for arm in "${arms[@]}"; do
              source=src
              if [ "$arm" = baseline ]; then source="$RUNNER_TEMP/baseline/src"; fi
              python scripts/benchmark_real_regional_upload.py --source "$source" --audio benchmark-inputs/reference.mp3 --request benchmarks/reference-regional-upload-request.json --operator benchmark-inputs/operator.json --output "results/regional-$pair-$arm" --timeout-s 600 --threads 1 --cpu "$benchmark_cpu" --allow-new-encoding --reference-wav data/source/reference-recording.wav
            done
            python scripts/benchmark_real_regional_upload.py --compare "results/regional-$pair-baseline" "results/regional-$pair-current" --output "results/regional-pair-$pair.json"
          done
      - name: Summarize only complete and exact paired runs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import statistics

          root = Path("results")
          reports = [json.loads((root / f"regional-pair-{pair}.json").read_text()) for pair in (1, 2, 3)]
          for report in reports:
              assert report["passed"] and report["scientific_payloads_exact"]
              assert report["regional_control"]["passed"] and report["array_comparison"]["passed"]
              assert all(report["full_pipeline_verified"].values())
          samples = {arm: [json.loads((root / f"regional-{pair}-{arm}" / "timing.json").read_text())
                           for pair in (1, 2, 3)] for arm in ("baseline", "current")}
          shared_keys = ("audio_sha256", "audio_bytes", "request_sha256", "operator_sha256", "python", "sqlite",
                         "numerical_package_versions", "numerical_threads", "cpu_affinity", "detail_plots_enabled",
                         "recording_control", "reference_wav_sha256", "ffmpeg_version", "verifier_sha256")
          common = {key: samples["baseline"][0][key] for key in shared_keys}
          for arm, runs in samples.items():
              for run in runs:
                  assert run["control_passed"] and run["fresh_run"] and not run["resumed"] and run["returncode"] == 0
                  assert {key: run[key] for key in shared_keys} == common
                  for key in ("source_revision", "ridge_fit_backend", "acoustic_backend"):
                      assert run[key] == runs[0][key]
          medians = {}
          for arm in ("baseline", "current"):
              receipts = [report["timings"][arm]["receipt_elapsed_s"] for report in reports]
              medians[arm] = {"http_receipt_seconds": statistics.median(receipts),
                              "driver_wall_seconds": statistics.median(run["wall_s"] for run in samples[arm]),
                              "driver_cpu_seconds": statistics.median(run["cpu_s"] for run in samples[arm])}
              for run, elapsed in zip(samples[arm], receipts):
                  run["http_receipt_seconds"] = elapsed
          summary = {"passed": True, "scientific_payloads_exact": True, "array_payloads_exact": True,
                     "scope": "Three fresh complete-HTTP pairs from one real recording; source-informed bounds/clock, no location-accuracy claim",
                     "timing_scope": "Median verified HTTP receipts; driver CPU includes verifier and child processes; profiling excluded",
                     "pair_order": [["baseline", "current"], ["current", "baseline"], ["baseline", "current"]],
                     "common_input_and_runtime": common,
                     "medians": medians,
                     "speedup": {key: medians["baseline"][key] / medians["current"][key] for key in medians["baseline"]},
                     "samples": samples, "pairs": reports}
          output = root / "regional-comparison.json"
          with output.open("x") as stream:
              json.dump(summary, stream, indent=2, allow_nan=False)
              stream.write("\n")
          print(json.dumps({"passed": True, "pairs": len(reports), "medians": medians, "speedup": summary["speedup"]}, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-regional-summary
          path: |
            results/regional-*/timing.json
            results/regional-*/result.json
            results/regional-*/http-verification.json
            results/regional-*/pipeline-evidence.json
            results/regional-pair-*.json
            results/regional-comparison.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: real-regional-failure-diagnostics
          path: |
            results/regional-*/jobs/*/search/search-report.json
            results/regional-*/jobs/*/provenance.json
            results/regional-*/*.log
          if-no-files-found: ignore
          retention-days: 3

  bounded-http:
    if: github.event_name == 'push' && github.ref == 'refs/heads/perf/real-pipeline-throughput-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONPATH: src
      BASELINE_REF: aa3dff686c989524daa20c081a816b792d9c8890
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install matched runtime
        run: |
          python -m pip install 'setuptools>=68' '.[test]' 'numpy==2.3.5' 'scipy==1.17.0' 'pandas==2.2.3' 'pyarrow==26.0.1' 'pyproj==3.8.0' 'matplotlib==3.10.8'
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Restore public recording and observed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_artifacts.py --bundle data-source --bundle data-adsb-derived --bundle data-terrain
      - name: Prepare one shared workload
        run: |
          python scripts/prepare_reference_upload.py --data-root data --output benchmark-http-inputs
          git worktree add --detach "$RUNNER_TEMP/http-baseline-source" "$BASELINE_REF"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("benchmark-http-inputs")
          request = json.loads((root / "request.json").read_text())
          request["search"]["bounds_wsen"] = [-73.545, 40.865, -73.505, 40.895]
          request["time_window"]["source_detail"] = (
              "Source-informed integration replay around the historical fitted recording "
              "start and benchmark receiver region; not independently measured recording "
              "time or a location-accuracy evaluation."
          )
          operator = json.loads((root / "operator.json").read_text())
          operator["search_workers"] = 1
          for name, value in (("request.json", request), ("operator.json", operator)):
              (root / name).write_text(json.dumps(value, indent=2) + "\n")
          PY
          ffmpeg -n -nostdin -v error -i data/source/reference-recording.wav -map 0:a:0 -vn -map_metadata -1 -ac 1 -ar 48000 -c:a libmp3lame -b:a 96k benchmark-http-inputs/recording.mp3
          python scripts/benchmark_prepared_measurements.py prepare --discovery evidence/audio/w1-sensitivity-20261102/reference/discovery.json --index benchmark-http-inputs/reference-region.sqlite --clock-half-width-s 120 --output benchmark-http-inputs/point-120.json
      - name: Recorded-input regression checks
        id: real_checks
        env:
          DOPPLERGEIST_REAL_CPA_FIXTURE: benchmark-http-inputs/point-120.json
        run: |
          mkdir -p results
          python -m pytest -q \
            tests/test_real_prepared_measurements.py \
            tests/test_real_geometry_kinematics.py \
            tests/test_real_batch_scalar_parity.py \
            tests/test_real_complete_batch_cache.py \
            tests/test_real_legacy_batch_cache.py \
            tests/test_real_refinement_lookup.py \
            tests/test_real_track_cache.py \
            tests/test_real_retention_batch.py \
            tests/test_real_retention_floor.py \
            tests/test_real_performance_helpers.py::test_cached_raster_transform_preserves_actual_candidate_heights \
            --junitxml=results/ci-real-tests.xml
          python - <<'CHECKS'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path("results/ci-real-tests.xml")).getroot().findall(".//testcase")
          skipped = [case.attrib.get("name") for case in cases if case.find("skipped") is not None]
          print(json.dumps({"selected_real_tests": len(cases), "skipped": skipped}))
          if not cases or skipped:
              raise SystemExit("Selected real-input checks must execute without skips")
          CHECKS
      - name: Record this new workload and runtime
        id: context
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          output = Path("results")
          output.mkdir(exist_ok=True)
          audio = Path("benchmark-http-inputs/recording.mp3")
          with audio.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          record = {
              "scope": "One fresh sequential matched HTTP pair on a new MP3 encoding of the public real WAV. Timings and event counts do not inherit the earlier original-MP3 measurements. Source-informed region/time; not independent location accuracy.",
              "baseline": os.environ["BASELINE_REF"],
              "current": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "packages": {name: importlib.metadata.version(name) for name in ("numpy", "scipy", "pandas", "pyarrow", "pyproj", "rasterio", "matplotlib")},
              "ffmpeg": subprocess.check_output(["ffmpeg", "-version"], text=True).splitlines()[0],
              "encoding": {"codec": "libmp3lame", "bitrate": "96k", "sample_rate_hz": 48000, "channels": 1},
              "source_sha256": digest,
              "source_bytes": audio.stat().st_size,
              "request": json.loads(Path("benchmark-http-inputs/request.json").read_text()),
              "operator": json.loads(Path("benchmark-http-inputs/operator.json").read_text()),
          }
          (output / "http-comparison-context.json").write_text(json.dumps(record, indent=2, allow_nan=False) + "\n")
          PY
      - name: Fresh baseline HTTP arm
        id: baseline
        run: python scripts/benchmark_real_bounded_upload.py --source "$RUNNER_TEMP/http-baseline-source/src" --inputs benchmark-http-inputs --output results/http-baseline --timeout-s 900
      - name: Fresh integrated HTTP arm
        id: current
        if: ${{ !cancelled() && steps.context.outcome == 'success' }}
        run: python scripts/benchmark_real_bounded_upload.py --source "$GITHUB_WORKSPACE/src" --inputs benchmark-http-inputs --output results/http-current --timeout-s 900
      - name: Compare complete scientific JSON and SQLite
        if: always() && steps.baseline.outcome == 'success' && steps.current.outcome == 'success'
        run: python scripts/compare_real_upload_performance.py --baseline results/http-baseline --current results/http-current --output results/http-science-comparison.json
      - name: Compare intake, decoded PCM, arrays, and PNG pixels
        if: always() && steps.baseline.outcome == 'success' && steps.current.outcome == 'success'
        run: python scripts/check_real_upload_arrays.py --baseline results/http-baseline --current results/http-current --output results/http-array-comparison.json
      - name: Print compact comparison results
        if: always()
        run: |
          python - <<'REPORT'
          import json
          from pathlib import Path
          def read(name):
              path = Path("results") / name
              if not path.is_file():
                  return {"missing": str(path)}
              try:
                  return json.loads(path.read_text())
              except (OSError, ValueError) as error:
                  return {"read_error": str(error), "path": str(path)}
          def select(value, fields):
              if "missing" in value or "read_error" in value:
                  return value
              return {key: value[key] for key in fields if key in value}
          science = read("http-science-comparison.json")
          arrays = read("http-array-comparison.json")
          passed = science.get("passed") is True and arrays.get("passed") is True
          result = {
              "both_parity_checks_passed": passed,
              "matched_pair_wall_speedup": science.get("verified_full_workflow_speedup") if passed else None,
              "scientific_comparison": select(science, ("passed", "scientific_payloads_exact", "run_kinds", "full_pipeline_verified", "checked_artifacts", "retention_ledgers", "outcomes", "differences")),
              "intake_array_comparison": select(arrays, ("passed", "checked", "manifest_verified_artifacts", "difference_count", "differences")),
              "http_receipts": {name: select(read(f"http-{name}/http-verification.json"), ("verification_passed", "implementation_unchanged", "full_pipeline_observed", "full_pipeline_requirements_met", "elapsed_s", "status", "reason_code", "event_count", "candidate_count", "source_sha256", "source_bytes", "service")) for name in ("baseline", "current")},
              "context": read("http-comparison-context.json"),
          }
          print("BOUNDED_HTTP_COMPARISON_BEGIN")
          print(json.dumps(result, indent=2, allow_nan=False))
          print("BOUNDED_HTTP_COMPARISON_END")
          REPORT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bounded-http-comparison
          path: |
            results/ci-real-tests.xml
            results/http-comparison-context.json
            results/http-science-comparison.json
            results/http-array-comparison.json
            results/http-*/http-verification.json
            results/http-*/pipeline-evidence.json
            results/http-*/service.log
          if-no-files-found: ignore
          retention-days: 14
