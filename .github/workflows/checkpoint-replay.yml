name: Historical real regional replay (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-replay-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  synthetic:
    name: Historical synthetic replay (disabled by owner directive)
    # Preserve the historical lane without executing prohibited synthetic work.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e . pytest
          python -m pip check
      - name: Record clean checkout and dependency versions
        run: |
          mkdir -p results/ci-environment
          git rev-parse HEAD > results/ci-environment/commit.txt
          git status --porcelain > results/ci-environment/status-before.txt
          python -m pip freeze --all > results/ci-environment/requirements-resolved.txt
          ffmpeg -version > results/ci-environment/ffmpeg-version.txt
      - name: Run repository tests
        run: python -m pytest -q --junitxml=results/ci-environment/pytest.xml
      - name: Verify provenance from an installed wheel
        run: |
          checkpoint_wheel_dir="$RUNNER_TEMP/checkpoint-wheel"
          python -m pip wheel --no-deps --wheel-dir "$checkpoint_wheel_dir/dist" .
          python -m venv "$checkpoint_wheel_dir/venv"
          "$checkpoint_wheel_dir/venv/bin/python" -m pip install --no-deps "$checkpoint_wheel_dir"/dist/*.whl
          "$checkpoint_wheel_dir/venv/bin/python" -I - results/ci-environment/wheel-provenance.json <<'PY'
          import json
          from pathlib import Path
          import sys
          import dopplergeist
          from dopplergeist.provenance import implementation_provenance
          package = Path(dopplergeist.__file__).resolve().parent
          assert "site-packages" in package.parts, package
          expected = implementation_provenance(Path("src"))
          observed = implementation_provenance(package.parent)
          assert observed["sha256"] == expected["sha256"]
          probe = package.parent / "unrelated_checkpoint_probe.py"
          try:
              probe.write_text("unrelated = True\n")
              assert implementation_provenance(package.parent) == observed
          finally:
              probe.unlink(missing_ok=True)
          receipt = {"passed": True, "package_path": str(package),
                     "installed_wheel_matches_checkout": True,
                     "unrelated_installed_file_excluded": True, "implementation": observed}
          Path(sys.argv[1]).write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"wheel_provenance_passed": True, "package_path": str(package),
                            "source_files": len(observed["sources"])}))
          PY
      - name: Replay configured synthetic methodology
        run: python scripts/ci_checkpoint_replay.py --output results/ci-synthetic --case-timeout-s 600
      - name: Upload evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-methodology-${{ github.sha }}
          path: |
            results/ci-environment/
            results/ci-synthetic/
            !results/ci-synthetic/generated/data/synthetic/*.wav
            !results/ci-synthetic/**/__pycache__/**
          if-no-files-found: error
          retention-days: 30

  regional:
    name: Source-informed real regional replay; no independent accuracy claim
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e . pytest
          python -m pip check
      - name: Check authenticated release downloader
        run: |
          sudo apt-get install -y gh
          gh --version
      - name: Restore and verify checkpoint assets with read-only authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_ci_checkpoint.py --destination . --receipt results/ci-restore.json
      - name: Replay source-informed regional reference
        run: python scripts/ci_checkpoint_replay.py --output results/ci-regional --real-config data/source/reproduce-local.json --case-timeout-s 900
      - name: Upload regional evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regional-methodology-${{ github.sha }}
          path: |
            results/ci-restore.json
            results/ci-regional/
            !results/ci-regional/**/__pycache__/**
          if-no-files-found: error
          retention-days: 30
