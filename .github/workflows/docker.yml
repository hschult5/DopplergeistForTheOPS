name: Docker build, local service and GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      image_tags: ${{ steps.metadata.outputs.tags }}
      image_revision: ${{ steps.metadata.outputs.revision }}
      image_id: ${{ steps.export.outputs.image_id }}
      image_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication event and tag rules
        run: python -m unittest discover -s tests -p test_container_publish_metadata.py
      - name: Derive image metadata and publication eligibility
        id: metadata
        run: python scripts/container_publish_metadata.py
      - name: Build runtime image
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ steps.metadata.outputs.revision }}
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker build --platform linux/amd64 --tag dopplergeist:ci \
            --label "org.opencontainers.image.title=DOPPLERGEIST" \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$IMAGE_REVISION" \
            --label "org.opencontainers.image.version=$IMAGE_VERSION" \
            --label "org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0" .
      - name: Check installed runtime, native modules and licenses
        run: |
          docker run --rm --entrypoint python dopplergeist:ci -m pip check
          docker run --rm --entrypoint ffmpeg dopplergeist:ci -version
          docker run --rm --entrypoint ffprobe dopplergeist:ci -version
          docker run --rm --interactive --entrypoint python dopplergeist:ci - <<'PY'
          import os
          from importlib import metadata, resources
          import soundfile
          import numpy, scipy, pandas, matplotlib, pyarrow, requests
          from pyproj import CRS
          import rasterio
          from dopplergeist import _native_ridge, _native_acoustic, _native_cpa, _native_index

          assert os.getuid() == 10001
          assert soundfile.available_formats()
          assert CRS.from_epsg(5070).is_projected
          assert rasterio.crs.CRS.from_epsg(5070).is_projected
          web = resources.files("dopplergeist.web")
          for name in ("index.html", "app.js", "style.css", "leaflet.js", "leaflet.css", "leaflet-license.txt"):
              assert web.joinpath(name).read_bytes(), name
          dist = metadata.distribution("dopplergeist")
          assert dist.metadata["License-Expression"] == "PolyForm-Noncommercial-1.0.0"
          installed = [str(path) for path in dist.files]
          assert any(path.endswith("/licenses/LICENSE") for path in installed)
          assert any(path.endswith("/licenses/licenses/MIT-legacy.txt") for path in installed)
          print("Non-root runtime, four native modules, GIS/audio libraries, assets and licenses passed.")
          PY
      - name: Check bridge HTTP and persistent volumes
        run: |
          cleanup() {
            docker logs dopplergeist-ci 2>/dev/null || true
            docker rm --force dopplergeist-ci >/dev/null 2>&1 || true
            docker volume rm dopplergeist-ci-jobs dopplergeist-ci-cache >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create dopplergeist-ci-jobs
          docker volume create dopplergeist-ci-cache
          docker run --detach --init --name dopplergeist-ci \
            --publish 127.0.0.1:8765:8765 \
            --mount type=volume,src=dopplergeist-ci-jobs,dst=/data/jobs \
            --mount type=volume,src=dopplergeist-ci-cache,dst=/home/dopplergeist/.cache/dopplergeist \
            dopplergeist:ci
          python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8765"
          for attempt in range(30):
              try:
                  with urlopen(base + "/api/capabilities", timeout=2) as response:
                      capabilities = json.load(response)
                  break
              except (URLError, TimeoutError, ConnectionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          assert capabilities["coverage"] == "conus"
          assert capabilities["online_enabled"] is False
          for path in ("/", "/app.js", "/style.css", "/leaflet.js", "/leaflet.css", "/leaflet-license.txt"):
              with urlopen(base + path, timeout=5) as response:
                  assert response.status == 200 and response.read(), path
          for headers in ({"Host": "invalid.example:8765"}, {"Origin": "http://invalid.example:8765"}):
              try:
                  urlopen(Request(base + "/api/capabilities", headers=headers), timeout=5)
              except HTTPError as error:
                  assert error.code == 403
              else:
                  raise AssertionError("Host/Origin checks must remain enabled")
          print("Bridge-published HTTP, packaged assets and existing Host/Origin checks passed.")
          PY
          docker exec dopplergeist-ci python -c 'from pathlib import Path; roots = [Path("/data/jobs"), Path.home()/".cache"/"dopplergeist"]; [(root/"container-write-check").write_text("persistent") for root in roots]'
          docker stop --time 15 dopplergeist-ci
          docker inspect --format '{{.State.ExitCode}}' dopplergeist-ci | grep -qx 0
          docker rm dopplergeist-ci
          docker run --rm --entrypoint python \
            --mount type=volume,src=dopplergeist-ci-jobs,dst=/data/jobs \
            --mount type=volume,src=dopplergeist-ci-cache,dst=/home/dopplergeist/.cache/dopplergeist \
            dopplergeist:ci -c 'from pathlib import Path; roots = [Path("/data/jobs"), Path.home()/".cache"/"dopplergeist"]; assert all((root/"container-write-check").read_text() == "persistent" for root in roots)'
      - name: Export the validated image
        id: export
        if: steps.metadata.outputs.publish == 'true'
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' dopplergeist:ci)
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/dopplergeist-image.tar" dopplergeist:ci
      - name: Transfer the validated image to the publish job
        id: upload
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dopplergeist-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: docker
    if: >-
      github.repository == '1337isnot1337/DOPPLERGEIST'
      && needs.docker.outputs.publish == 'true'
      && ((github.event_name == 'push'
           && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download this run's validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.docker.outputs.image_artifact_id }}
          path: ${{ runner.temp }}
      - name: Load and identify the validated image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.docker.outputs.image_id }}
        run: |
          docker load --input "$RUNNER_TEMP/dopplergeist-image.tar"
          test "$(docker image inspect --format '{{.Id}}' dopplergeist:ci)" = "$EXPECTED_IMAGE_ID"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated image
        env:
          IMAGE_TAGS: ${{ needs.docker.outputs.image_tags }}
          IMAGE_REVISION: ${{ needs.docker.outputs.image_revision }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tags = json.loads(os.environ["IMAGE_TAGS"])
          if not tags:
              raise ValueError("No approved image tags to publish")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Published Docker image\n\n")
              for tag in tags:
                  subprocess.run(["docker", "tag", "dopplergeist:ci", tag], check=True)
                  if tag.endswith(":main"):
                      try:
                          remote = subprocess.run(
                              ["git", "ls-remote", "--exit-code",
                               "https://github.com/1337isnot1337/DOPPLERGEIST.git",
                               "refs/heads/main"],
                              check=True, capture_output=True, text=True, timeout=30)
                          fields = remote.stdout.split()
                          if (len(fields) != 2 or fields[1] != "refs/heads/main"
                                  or not re.fullmatch(r"[0-9a-f]{40}", fields[0])):
                              raise ValueError("Unexpected public main-ref response")
                      except (OSError, subprocess.SubprocessError, ValueError) as error:
                          summary.write(f"- Did not push `{tag}`: current public main could not be verified.\n")
                          raise RuntimeError("Could not verify current public main; :main was not pushed") from error
                      if fields[0] != os.environ["IMAGE_REVISION"]:
                          message = (f"Skipped `{tag}`: built revision `{os.environ['IMAGE_REVISION']}` "
                                     f"differs from current main `{fields[0]}`.")
                          print(message)
                          summary.write(f"- {message}\n")
                          continue
                  subprocess.run(["docker", "push", tag], check=True)
                  summary.write(f"- Published `{tag}`\n")
                  digests = json.loads(subprocess.run(
                      ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", tag],
                      check=True, capture_output=True, text=True).stdout)
                  for digest in digests or []:
                      summary.write(f"  - Registry digest: `{digest}`\n")
              summary.write("\nAll published tags refer to the image validated by this workflow run.\n")
          PY
