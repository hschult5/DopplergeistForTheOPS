name: Installation and static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} installation and static checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install '.[test]'
          python -m pip check
      # The owner requires real recordings for further validation. The historical
      # pytest suite generates synthetic inputs, so this workflow does not run it.
      - name: Compile source without executing experiments
        run: python -m compileall -q src scripts
      - name: Check benchmark instrumentation detection
        run: python scripts/check_benchmark_instrumentation.py
      - name: Check prepared-index compatibility with recorded observations
        run: python -m pytest -q tests/test_real_prepared_geometry_compatibility.py::test_pinned_legacy_geometry_and_data_source_preserve_real_tracks
      - name: Check country profiles against the actual BKG land boundary
        run: python scripts/check_country_profiles.py --online --cache-root "$RUNNER_TEMP/dopplergeist-geography"
      - name: Check terrain seams against observed Copernicus raster footprints
        run: python -m pytest -q tests/test_real_terrain_tile_seams.py
      - name: Check experimental episode artifacts from recorded media
        run: python -m pytest -q tests/test_real_episode_artifact.py tests/test_real_episode_motion.py tests/test_real_episode_cli.py
      - name: Check progress reporting against recorded empty-tile checkpoints
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from dopplergeist.tiled_search import _tile_coordinates, grid_tiles

          source = Path("tests/data/real-empty-tile-workload.json")
          original = hashlib.sha256(source.read_bytes()).hexdigest()
          recorded = json.loads(source.read_text())
          query = recorded["query"]
          budget = query["budget"]
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              command = [sys.executable, "scripts/report_checkpoint_progress.py", str(source),
                         "--json", str(root / "progress.json"), "--cache", str(root / "cache.json")]
              subprocess.run(command, check=True)
              first = json.loads((root / "progress.json").read_text())
              expected = sum(len(_tile_coordinates(tuple(tile["cells"]), budget["spacing_m"],
                  query["bounds"], query["crs"])) for tile in recorded["tiles"])
              coverage = first["coverage"]
              assert first["receipt_funnel"]["receipt_count"] == len(recorded["tiles"]) == 256
              assert coverage["receipt_recorded"]["unique_receiver_points"] == expected > 0
              assert coverage["requested_root_tiles"] == sum(1 for _ in grid_tiles(
                  query["bounds"], budget["spacing_m"], budget["tile_cells"], query["crs"]))
              assert coverage["canonical_stage_agreed"] is None
              metrics = {row["metric"]: row for row in first["receipt_funnel"]["metrics"]}
              assert metrics["grid_points"]["known_sum"] == metrics["tracks"]["known_sum"] == 0
              assert metrics["cpa_rows"]["known_sum"] is None
              trials = first["trial_classification"]
              assert trials["status"] == "no_telemetry"
              assert trials["selected_receipts"] == 256
              assert trials["receipts_with_all_trial_counters"] == 0
              assert trials["known_counters"] is None
              assert trials["reported_trial_visits"] is None
              assert trials["percent_rejected"] is None
              assert trials["percent_unknown"] is None
              subprocess.run(command, check=True)
              refreshed = json.loads((root / "progress.json").read_text())
              assert refreshed["read_budget"].get("bytes_read", 0) == 0
              assert refreshed["coverage"] == coverage
          assert hashlib.sha256(source.read_bytes()).hexdigest() == original
          print(f"Recorded checkpoint progress passed: 256 receipts, {expected} receiver points; cached refresh reads no input JSON.")
          PY
      - name: Check metamorphic completion gates against real recorded outcomes
        run: python -m pytest -q tests/test_real_metamorphic_runner.py::test_recorded_matrix_keeps_coverage_and_completion_separate_from_timing
      - name: Check weak-fit guidance against recorded real ridge diagnostics
        run: python -m pytest -q tests/test_real_guidance_fit.py
      - name: CLI smoke check
        run: dopplergeist --help
      - name: Check installed native validator and packaged browser assets
        run: |
          python -I - <<'PY'
          from importlib import resources
          import json
          from pathlib import Path
          import dopplergeist
          from dopplergeist import _native_cpa, _native_index, _native_ridge, automatic, jobs, service

          package = Path(dopplergeist.__file__).resolve().parent
          assert "site-packages" in package.parts, package
          assert Path(_native_ridge.__file__).resolve().parent == package
          assert Path(_native_cpa.__file__).resolve().parent == package
          assert Path(_native_index.__file__).resolve().parent == package
          observed = json.loads(Path("research/trajectory-motion/frozen/fresh-a6cc10.json").read_text())
          assert _native_index.payload_columns(observed) is not None, "Native real-column extraction failed"
          assert callable(_native_ridge.fit_irls_batch), "Native batch fitter did not build"
          assert callable(_native_ridge.fit_statistics), "Native fit counters did not build"
          assert callable(_native_cpa.select), "Native CPA reducer did not build"
          assert callable(getattr(_native_ridge, "event_fit_reason", None)), "Native evidence validator did not build"
          assert callable(getattr(_native_ridge, "valid_ridge_events", None)), "Native boolean validator did not build"
          fixture = json.loads(Path("tests/data/real-ridge-batch-arithmetic.json").read_text())
          fits = fixture["legacy_diagnostics"]
          assert _native_ridge.event_fit_reason(
              fits, [fit["score"] for fit in fits], [fit["f0_hz"] for fit in fits],
              [fixture["event"]] * len(fits)) == 0
          assert _native_ridge.valid_ridge_events(
              fits, [fit["score"] for fit in fits], [fit["f0_hz"] for fit in fits],
              [fixture["event"]] * len(fits)) is True
          web = resources.files("dopplergeist.web")
          for name in ("index.html", "app.js", "style.css"):
              assert web.joinpath(name).is_file(), name
              assert web.joinpath(name).read_bytes(), name
          print("Installed native validation of recorded fits and browser assets passed; no audio or tracks generated.")
          PY
