name: Python distribution and PyPI

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - README.md
      - src/**
      - docs/PYPI.md
      - .github/workflows/python-package.yml
  pull_request:
    paths:
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - README.md
      - src/**
      - docs/PYPI.md
      - .github/workflows/python-package.yml
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-smoke:
    name: Build and install the source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require release commit to be on main
        if: github.event_name == 'release'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "Release commit is not on main"; exit 1; }
      - name: Require release tag to match the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected = f"v{project['version']}"
          assert os.environ["RELEASE_TAG"] == expected, (
              f"Release tag must be {expected}; got {os.environ['RELEASE_TAG']}"
          )
          PY
      - name: Build distributions and check PyPI metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "License-Expression: PolyForm-Noncommercial-1.0.0" in metadata
              assert "Description-Content-Type: text/markdown" in metadata
              for filename in ("index.html", "app.js", "style.css", "leaflet.js", "leaflet.css", "leaflet-license.txt"):
                  assert f"dopplergeist/web/{filename}" in names, filename
              for prefix in ("licenses/LICENSE", "licenses/licenses/MIT-legacy.txt"):
                  assert any(name.endswith("/" + prefix) for name in names), prefix
              for module in ("ridge", "acoustic", "cpa", "index"):
                  assert any(f"dopplergeist/_native_{module}." in name and name.endswith(".so") for name in names), module
          PY
      - name: Install built wheel and verify the CLI
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          dopplergeist --version
          dopplergeist --help
          python -I - <<'PY'
          from importlib import metadata, resources
          from dopplergeist import _native_acoustic, _native_cpa, _native_index, _native_ridge
          assert metadata.version("dopplergeist")
          web = resources.files("dopplergeist.web")
          for name in ("index.html", "app.js", "style.css", "leaflet.js", "leaflet.css", "leaflet-license.txt"):
              assert web.joinpath(name).read_bytes(), name
          PY

  sdist:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: package-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: package-smoke
    name: Wheels / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
          - platform: windows-amd64
            runner: windows-2025
            arch: AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and smoke-test binary wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: |
          python -m pip install "cibuildwheel==3.4.1"
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release' && github.repository == '1337isnot1337/DOPPLERGEIST'
    needs: [package-smoke, sdist, wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pypi-*
          path: dist/
          merge-multiple: true
      - name: Check distribution set before uploading
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          files = list(Path("dist").iterdir())
          wheels = [f for f in files if f.suffix == ".whl"]
          sdists = [f for f in files if f.name.endswith(".tar.gz")]
          assert len(wheels) == 19, f"Expected 19 platform/version wheels; found {len(wheels)}"
          assert not any("cp314" in f.name and "macosx" in f.name and "x86_64" in f.name for f in wheels), wheels
          assert len(sdists) == 1, f"Expected one source archive; found {len(sdists)}"
          assert all(f.name.startswith(f"dopplergeist-{version}-") for f in wheels), wheels
          assert sdists[0].name == f"dopplergeist-{version}.tar.gz", sdists
          print(f"Validated {len(wheels)} wheels and one sdist for {version}")
          PY
      - name: Publish to PyPI using GitHub OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
